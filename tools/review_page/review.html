<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>诡秘之夜 · 图片筛查</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#18242e;--line:#354956;--text:#e8eff3;--muted:#a6bac6;--accent:#e9b56e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,"Microsoft YaHei",sans-serif}header{padding:16px 24px;border-bottom:1px solid var(--line);background:#14212b}h1{font-size:20px;margin:0 0 6px;font-weight:650;letter-spacing:1px}.sub,.muted{color:var(--muted);font-size:12px}.toolbar,.filters,.scale,.status-buttons{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}button,input,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:6px;background:#101b24;padding:7px 10px}button{cursor:pointer}button:hover,button.active{border-color:var(--accent);background:#26313a}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #80c9eb;outline-offset:2px}#count{font-variant-numeric:tabular-nums;margin:0 6px;min-width:190px}#search{width:min(370px,100%)}#jump{width:80px}#export-json{margin-left:auto;background:#784f24;border-color:#a6753c}main{padding:16px 24px 24px}.heading{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}h2{font-size:17px;margin:0 0 5px}#meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}#note{margin:8px 0;color:#dfbf91;font-size:12px}.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin:12px 0}.pane{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}.pane-title{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}.imagebox{height:48vh;min-height:260px;overflow:auto;display:grid;align-items:center;justify-items:center;background:repeating-conic-gradient(#25343e 0% 25%,#1c2a34 0% 50%) 0 0/20px 20px}.imagebox.navy{background:#142730}.imagebox.black{background:#000}.imagebox.light{background:#d7d7d7}.imagebox img{display:block;max-width:none;image-rendering:pixelated}.imagebox.smooth img{image-rendering:auto}.pane a{color:#b6d4e8}.feedback{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{border:1px solid var(--line);padding:13px;border-radius:8px;background:var(--panel)}label{display:block;margin-bottom:7px;font-weight:600}textarea{width:100%;height:112px;resize:vertical;background:#0e1821;font-size:16px;line-height:1.5}#text-list{max-height:150px;overflow:auto;font-size:12px;line-height:1.6;white-space:pre-wrap}#saved{margin-top:7px;font-size:12px;color:#a1d5b9}#error{color:#ffb4a4;white-space:pre-wrap;font-size:13px;min-height:18px}#stale{color:#ffd08b;font-size:12px}details{margin-top:10px;font-size:12px;color:var(--muted)}#refs{white-space:pre-wrap;max-height:140px;overflow:auto}.hidden{display:none}footer{padding:10px 0;color:var(--muted);font-size:12px}@media(max-width:800px){header,main{padding:12px}.pair,.feedback{grid-template-columns:1fr}.imagebox{height:32vh;min-height:200px}#export-json{margin-left:0}}
</style></head><body>
<header><h1>诡秘之夜 <span class="muted">/ 图片筛查</span></h1><div class="sub">左边原图，右边最终 ISO 回读图。意见保存在本机，可导出后发回修改。</div>
<div class="toolbar"><button id="prev">← 上一张</button><strong id="count"></strong><button id="next">下一张 →</button><input id="jump" type="number" min="1" aria-label="图片编号"><button id="go">跳转</button><input id="search" type="search" placeholder="搜索资源名、译文、ID" aria-label="筛选图片"><button id="export-json">导出意见 JSON</button><button id="export-csv">导出 CSV</button><button id="import">导入意见</button><input id="import-file" type="file" accept=".json,application/json" class="hidden"></div>
<div class="filters" role="group" aria-label="图片范围"><button data-filter="localized" class="active">已汉化图片</button><button data-filter="all">全部源图</button><button data-filter="unreviewed">尚未确认</button><button data-filter="issue">有意见</button><button data-filter="fixed">此次修复</button><button data-filter="retained">保留原图</button><span id="progress" class="muted"></span></div>
</header><main><div class="heading"><div><h2 id="name"></h2><div id="meta"></div></div><div class="scale" role="group" aria-label="图片显示"><span class="muted">缩放</span><button data-zoom="fit" class="active">适应</button><button data-zoom="1">1×</button><button data-zoom="2">2×</button><button data-zoom="4">4×</button><button id="sampling">像素清晰</button><button data-bg="checker" class="active">棋盘底</button><button data-bg="navy">深蓝底</button><button data-bg="black">黑底</button><button data-bg="light">浅底</button></div></div><p id="note"></p>
<div class="pair"><section class="pane"><div class="pane-title"><strong>原图</strong><a id="original-link" target="_blank" rel="noopener">打开原尺寸</a></div><div class="imagebox" id="original-box"><img id="original" alt="原图"></div></section><section class="pane"><div class="pane-title"><strong>汉化图 · 最终 ISO 原生贴图</strong><a id="localized-link" target="_blank" rel="noopener">打开原尺寸</a></div><div class="imagebox" id="localized-box"><img id="localized" alt="汉化图"></div></section></div>
<div class="feedback"><section class="card"><label for="comment">我的意见</label><textarea id="comment" placeholder="例如：右侧有旧字残留；第三行偏下；字号不一致……"></textarea><div class="status-buttons" role="group" aria-label="审查状态"><button data-status="unreviewed">未确认</button><button data-status="ok">这张认可</button><button data-status="issue">需要修改</button></div><div id="stale"></div><div id="saved" role="status"></div></section><section class="card"><label>图中文字</label><div id="text-list"></div><details><summary>资源位置与版本</summary><div id="refs"></div><div id="revision"></div></details></section></div>
<div id="error" role="alert"></div><footer>← / → 直接翻页，输入框内同样有效；输入法组词时不抢按键。空白意见不等于认可。网页不会启动游戏，也不会上传数据。</footer></main>
<script type="application/json" id="review-data">__DATA__</script><script>__CORE__</script><script>__SCRIPT__</script></body></html>
